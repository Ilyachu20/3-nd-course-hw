<!doctype html>
<html lang="ru">
  <head>
    <title>Вход — Лента комментариев</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <form class="login-form">
        <h1>Вход</h1>
        <input class="login-input" name="login" type="text" placeholder="Логин" required />
        <input class="login-input" name="password" type="password" placeholder="Пароль" required />
        <p class="login-error hidden"></p>
        <button class="login-button" type="submit">Войти</button>
        <a href="index.html">Вернуться к комментариям</a>
      </form>
    </div>
    <script type="module" src="./src/login.js"></script>
  </body>
</html>
